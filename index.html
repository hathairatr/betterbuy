<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Better Buy</title>
    <meta name="description" content="Make smart shopping decisions easily. Enter price, content size, and promotions to find which item gives you the most value per cost unit.">

    <!-- Open Graph / Facebook / LINE / Chat apps -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="The Better Buy">
    <meta property="og:description" content="Make smart shopping decisions easily. Enter price, content size, and promotions to find which item gives you the most value per cost unit.">
    <meta property="og:image" content="images/icon.jpg">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="The Better Buy">
    <meta name="twitter:description" content="Make smart shopping decisions easily. Enter price, content size, and promotions to find which item gives you the most value per cost unit.">
    <meta name="twitter:image" content="images/icon.jpg">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-X9VBTNJW98"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-X9VBTNJW98');
    </script>
    
    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="images/icon.jpg">
    <link rel="apple-touch-icon" href="images/icon.jpg">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    
    <!-- Google Fonts: Kanit & Caprasimo (Cookie style) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Fraunces:opsz,wght@9..144,800..900&family=Kanit:wght@300;400;500;600&family=Shrikhand&display=swap" rel="stylesheet">

    <!-- Custom Tailwind Config & Styles -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Fraunces', 'sans-serif'],
                    },
                    colors: {
                        cream: {
                            50: '#FFFDF9',
                            100: '#FFF8ED',
                            200: '#FFEED4',
                        },
                        primary: {
                            DEFAULT: '#eea7b9',
                            50: '#fdf4f6',
                            100: '#fae4e9',
                            200: '#f5c9d3',
                            300: '#f1b8c6',
                            400: '#eea7b9',
                            500: '#b84e68',
                            600: '#9a3c53',
                        },
                        secondary: {
                            DEFAULT: '#76472e',
                            600: '#9b5e3d',
                            700: '#885134',
                            800: '#76472e',
                            900: '#532f1c',
                        },
                        pink: {
                            50: '#fdf4f6',
                            100: '#fae4e9',
                            200: '#f5c9d3',
                            300: '#f1b8c6',
                            400: '#eea7b9',
                            500: '#b84e68',
                            600: '#9a3c53',
                        },
                        brown: {
                            600: '#9b5e3d',
                            700: '#885134',
                            800: '#76472e',
                            900: '#532f1c',
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 40px -10px rgba(238, 167, 185, 0.25)',
                        'card': '0 4px 20px -2px rgba(238, 167, 185, 0.12)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #fef4f1;
            background: linear-gradient(180deg, #fff9f7 0%, #fef4f1 55%, #fae8e1 100%);
            background-attachment: fixed;
            color: #76472e;
        }
        /* ซ่อนลูกศรใน input type number เฉพาะ class hide-arrows */
        .hide-arrows::-webkit-inner-spin-button,
        .hide-arrows::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .hide-arrows {
            -moz-appearance: textfield;
        }
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
            transform: translateY(10px) scale(0.98);
        }
        .best-value-card {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { border-color: #eea7b9; box-shadow: 0 0 0 0 rgba(238, 167, 185, 0.45); }
            70% { border-color: #f5c9d3; box-shadow: 0 0 0 10px rgba(238, 167, 185, 0); }
            100% { border-color: #eea7b9; box-shadow: 0 0 0 0 rgba(238, 167, 185, 0); }
        }
        /* Cookie style title */
        .cookie-title {
            font-family: 'Caprasimo', 'Fraunces', cursive, serif;
            color: #451811;
            -webkit-text-stroke: 6px #ffffff;
            paint-order: stroke fill;
            filter: drop-shadow(0 5px 0 #fbdad1) drop-shadow(0 10px 16px rgba(69, 24, 17, 0.15));
            letter-spacing: -0.01em;
            line-height: 1.2;
            display: inline-block;
        }
        @media (min-width: 640px) {
            .cookie-title {
                -webkit-text-stroke: 8px #ffffff;
                filter: drop-shadow(0 6px 0 #fbdad1) drop-shadow(0 14px 20px rgba(69, 24, 17, 0.16));
            }
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 sm:px-6 lg:px-8 flex flex-col items-center">

    <div id="app" class="w-full max-w-6xl mx-auto space-y-8" v-cloak>
        
        <!-- Header -->
        <header class="text-center relative pt-2">
            <!-- Ambient soft glow behind header -->
            <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-pink-300/20 rounded-full blur-3xl pointer-events-none -z-10"></div>

            <!-- Main Title (Cookie Style) -->
            <div class="my-2">
                <h1 class="cookie-title text-4xl sm:text-5xl md:text-6xl cursor-default select-none transition-transform duration-300 hover:scale-105">
                    The Better Buy 🛍️
                </h1>
            </div>
        </header>

        <!-- Options: 2 or 3 items -->
        <div class="flex justify-center">
            <div class="bg-white p-1.5 rounded-full inline-flex items-center shadow-sm border border-pink-100 gap-1.5">
                <span class="text-sm font-medium text-brown-800 pl-3 select-none">Compare</span>
                <button @click="numItems = 2" 
                    :class="['px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300', numItems === 2 ? 'bg-pink-100 text-pink-500 shadow-sm' : 'text-brown-800 hover:bg-pink-50']">
                    2
                </button>
                <button @click="numItems = 3" 
                    :class="['px-4 py-1.5 rounded-full text-sm font-semibold transition-all duration-300', numItems === 3 ? 'bg-pink-100 text-pink-500 shadow-sm' : 'text-brown-800 hover:bg-pink-50']">
                    3
                </button>
                <span class="text-sm font-medium text-brown-800 pr-3 select-none">Items</span>
            </div>
        </div>

        <!-- Product Cards Grid -->
        <div :class="['grid gap-6 transition-all duration-500', numItems === 2 ? 'grid-cols-1 md:grid-cols-2 max-w-4xl mx-auto' : 'grid-cols-1 md:grid-cols-3 max-w-6xl mx-auto']">
            
            <transition-group name="fade">
                <div v-for="(item, index) in visibleItems" :key="'item-'+index" 
                    :class="['product-card bg-white rounded-3xl p-6 sm:p-8 transition-all duration-300 relative border-2', 
                            isBestValue(index) ? 'border-pink-400 shadow-soft best-value-card' : 'border-white shadow-card hover:shadow-soft hover:border-pink-50']">
                    
                    <!-- Crown for best value -->
                    <div v-if="isBestValue(index)" class="absolute -top-4 -right-3 bg-white border-2 border-pink-300 w-11 h-11 flex items-center justify-center rounded-full shadow-md transform rotate-12 text-2xl select-none">
                        👑
                    </div>

                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-pink-50 flex items-center justify-center text-pink-500 font-bold text-lg">
                                {{ index + 1 }}
                            </div>
                            <h2 class="text-xl font-medium text-brown-900">Item {{ index + 1 }}</h2>
                        </div>
                        <!-- Reset Button for this item -->
                        <button @click="resetItem(index)" 
                            type="button" 
                            title="Clear Item" 
                            class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium text-brown-800/50 hover:text-pink-600 hover:bg-pink-100/70 border border-pink-100/70 hover:border-pink-200 transition-all duration-200 cursor-pointer active:scale-95"
                            aria-label="Clear this item">
                            <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                <path d="M3 3v5h5"/>
                            </svg>
                            <span>Clear</span>
                        </button>
                    </div>

                    <div class="space-y-5">
                        <!-- Promotion Type -->
                        <div>
                            <label class="block text-sm font-medium text-brown-800 mb-1">Promotion</label>
                            <select v-model="item.promo" @change="onPromoChange($event)" class="w-full bg-cream-50 border border-pink-100 text-brown-900 text-sm rounded-xl focus:ring-pink-200 focus:border-pink-300 block p-3 pr-10 outline-none transition-colors appearance-none cursor-pointer bg-[url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%2376472e%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpolyline%20points%3D%226%209%2012%2015%2018%209%22%3E%3C%2Fpolyline%3E%3C%2Fsvg%3E')] bg-no-repeat bg-[position:right_1rem_center] bg-[length:1.2em_1.2em]">
                                <option value="normal">Normal Price (No promo)</option>
                                <option value="1get1">Buy 1 Get 1 Free</option>
                                <option value="2get1">Buy 2 Get 1 Free</option>
                            </select>
                        </div>

                        <!-- Weight per piece -->
                        <div>
                            <label class="block text-sm font-medium text-brown-800 mb-1">Net Content per piece <span class="text-brown-800/50">(g / ml / oz)</span></label>
                            <input type="number" v-model.number="item.weight" min="0" enterkeyhint="next" @focus="$event.target.select()" @keydown.enter.prevent="focusNext($event)" class="card-input hide-arrows w-full bg-cream-50 border border-pink-100 text-brown-900 text-sm rounded-xl focus:ring-pink-200 focus:border-pink-300 block p-3 outline-none transition-colors">
                        </div>

                        <!-- Quantity (Show only when Normal promotion) -->
                        <div v-if="item.promo === 'normal'">
                            <label class="block text-sm font-medium text-brown-800 mb-1">Quantity</label>
                            <input type="number" v-model.number="item.qty" min="1" step="1" enterkeyhint="next" @focus="$event.target.select()" @change="ensureMinQty(item)" @blur="ensureMinQty(item)" @keydown.enter.prevent="ensureMinQty(item); focusNext($event)" class="card-input w-full bg-cream-50 border border-pink-100 text-brown-900 text-sm rounded-xl focus:ring-pink-200 focus:border-pink-300 block p-3 outline-none transition-colors">
                        </div>

                        <!-- Price -->
                        <div>
                            <label class="block text-sm font-medium text-brown-800 mb-1">Price</label>
                            <div class="relative">
                                <input type="number" v-model.number="item.price" min="0" enterkeyhint="next" @focus="$event.target.select()" @keydown.enter.prevent="focusNext($event)" class="card-input hide-arrows w-full bg-cream-50 border border-pink-100 text-brown-900 text-sm rounded-xl focus:ring-pink-200 focus:border-pink-300 block p-3 outline-none transition-colors">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Individual Result Summary -->
                    <div class="mt-6 pt-5 border-t border-pink-50">
                        <div v-if="results[index].isValid" class="space-y-2">
                            <!-- Price per Unit Box -->
                            <div class="flex justify-between items-end mt-2 pt-2 bg-pink-50/50 p-3 rounded-xl">
                                <span class="text-sm font-medium text-pink-500">Price per Unit:</span>
                                <div class="text-right">
                                    <span class="text-2xl font-semibold text-pink-600 leading-none">{{ formatPricePerUnit(results[index].pricePerUnit) }}</span>
                                    <span class="text-xs text-pink-400 block mt-0.5">cost / unit</span>
                                </div>
                            </div>
                        </div>
                        <div v-else class="text-center py-4 bg-gray-50 rounded-xl border border-dashed border-gray-200">
                            <span class="text-sm text-gray-400">Please complete all fields</span>
                        </div>
                    </div>
                </div>
            </transition-group>
        </div>

        <!-- Summary Banner (Only shows when there's a calculation) -->
        <transition name="fade">
            <div v-if="hasValidCalculations" class="max-w-4xl mx-auto bg-gradient-to-r from-pink-400 to-pink-300 rounded-3xl p-6 sm:p-8 text-brown-900 shadow-soft relative overflow-hidden flex flex-col sm:flex-row items-center justify-between text-center sm:text-left">
                <!-- Decorative background elements -->
                <div class="absolute -top-10 -right-10 w-40 h-40 bg-white opacity-25 rounded-full blur-2xl"></div>
                <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-white opacity-25 rounded-full blur-xl"></div>
                
                <div class="relative z-10 space-y-1 mb-4 sm:mb-0">
                    <div class="text-2xl sm:text-3xl font-semibold text-brown-900 leading-normal" v-html="winningMessage">
                    </div>
                </div>
                
                <div class="relative z-10 flex flex-col sm:flex-row items-center gap-3">
                    <div class="bg-white/40 backdrop-blur-sm rounded-2xl px-6 py-3 border border-white/50 flex flex-col items-center shadow-sm">
                        <span class="text-brown-800/80 text-xs mb-1 font-medium">Best Price</span>
                        <div class="flex items-baseline space-x-1 text-brown-900">
                            <span class="text-3xl font-bold">{{ formatPricePerUnit(bestPricePerUnit) }}</span>
                            <span class="text-sm font-medium">cost / unit</span>
                        </div>
                    </div>

                    <!-- Clear All Button in Summary Banner -->
                    <!-- <button @click="clearAll" 
                        type="button" 
                        title="Clear all fields" 
                        class="bg-white/70 hover:bg-white text-brown-900 px-4 py-3 rounded-2xl text-sm font-semibold shadow-sm border border-white/80 transition-all duration-300 flex items-center gap-2 hover:scale-105 active:scale-95 cursor-pointer whitespace-nowrap">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                            <path d="M3 3v5h5"/>
                        </svg>
                        <span>Clear All</span>
                    </button> -->
                </div>
            </div>
        </transition>

        <!-- Footer -->
        <footer class="text-center pb-8 pt-4">
            <p class="text-xs text-brown-800/40">Enjoy your shopping 😉</p>
        </footer>

    </div>

    <script>
        const { createApp, ref, computed } = Vue;

        createApp({
            setup() {
                const numItems = ref(2);
                
                // Initialize items state
                const items = ref([
                    { promo: 'normal', weight: null, qty: 1, price: null },
                    { promo: 'normal', weight: null, qty: 1, price: null },
                    { promo: 'normal', weight: null, qty: 1, price: null }
                ]);

                // Filter items based on selected quantity
                const visibleItems = computed(() => {
                    return items.value.slice(0, numItems.value);
                });

                // Calculate results for each item
                const results = computed(() => {
                    return visibleItems.value.map((item, index) => {
                        const price = parseFloat(item.price);
                        const weight = parseFloat(item.weight);
                        const qty = item.promo === 'normal' ? parseFloat(item.qty) : 1;

                        // Validation
                        if (isNaN(price) || isNaN(weight) || isNaN(qty) || price <= 0 || weight <= 0 || qty < 1) {
                            return { isValid: false, pricePerUnit: 0, cost: 0, totalWeight: 0, index };
                        }

                        let cost = 0;
                        let totalWeight = 0;
                        const baseWeight = weight * qty;

                        // Logic based on promotion
                        if (item.promo === 'normal') {
                            // No promo: Pay for 1 unit, get 1 unit (multiplied by qty inside)
                            cost = price;
                            totalWeight = baseWeight;
                        } else if (item.promo === '1get1') {
                            // Buy 1 Get 1: Pay for 1 unit, get 2 units
                            cost = price;
                            totalWeight = baseWeight * 2;
                        } else if (item.promo === '2get1') {
                            // Buy 2 Get 1: Pay for 2 units, get 3 units
                            cost = price * 2;
                            totalWeight = baseWeight * 3;
                        }

                        const pricePerUnit = totalWeight > 0 ? (cost / totalWeight) : 0;

                        return {
                            isValid: true,
                            pricePerUnit,
                            cost,
                            totalWeight,
                            index
                        };
                    });
                });

                const hasValidCalculations = computed(() => {
                    return results.value.some(r => r.isValid);
                });

                const bestPricePerUnit = computed(() => {
                    const valid = results.value.filter(r => r.isValid);
                    if (valid.length === 0) return 0;
                    return Math.min(...valid.map(r => r.pricePerUnit));
                });

                const isBestValue = (index) => {
                    const valid = results.value.filter(r => r.isValid);
                    if (valid.length < 2) return false;
                    const r = results.value[index];
                    if (!r || !r.isValid) return false;
                    return Math.abs(r.pricePerUnit - bestPricePerUnit.value) < 0.00001;
                };

                const winningMessage = computed(() => {
                    const valid = results.value.filter(r => r.isValid);
                    if (valid.length < 2) return "Waiting for data...";

                    const bestResults = valid.filter(r => Math.abs(r.pricePerUnit - bestPricePerUnit.value) < 0.00001);
                    
                    if (bestResults.length === valid.length) {
                        return "All items have the same price per unit!";
                    } else if (bestResults.length > 1) {
                        const names = bestResults.map(r => `<span class="inline-flex items-center bg-white text-brown-900 font-bold px-3 py-0.5 rounded-2xl shadow-sm border border-white/90 align-middle mx-1">Item ${r.index + 1}</span>`).join(' & ');
                        return `${names} are the best value! 🎉`;
                    } else {
                        const nameBadge = `<span class="inline-flex items-center bg-white text-brown-900 font-bold px-3.5 py-0.5 rounded-2xl shadow-sm border border-white/90 align-middle mr-1.5">Item ${bestResults[0].index + 1}</span>`;
                        return `${nameBadge} is the best value! 🎉`;
                    }
                });

                const formatPricePerUnit = (val) => {
                    if (!val || isNaN(val)) return '0.00';
                    return Number(val).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                };

                const ensureMinQty = (item) => {
                    if (item.qty === null || item.qty === undefined || item.qty < 1) {
                        item.qty = 1;
                    }
                };

                const focusNext = (event) => {
                    const inputs = Array.from(document.querySelectorAll('.card-input'))
                        .filter(el => el.offsetParent !== null && !el.disabled);
                    
                    const currentIndex = inputs.indexOf(event.target);
                    if (currentIndex !== -1) {
                        if (currentIndex < inputs.length - 1) {
                            const next = inputs[currentIndex + 1];
                            next.focus();
                            if (typeof next.select === 'function') {
                                next.select();
                            }
                        } else {
                            event.target.blur();
                        }
                    }
                };

                const onPromoChange = (event) => {
                    const card = event.target.closest('.product-card');
                    if (card) {
                        setTimeout(() => {
                            const nextInput = card.querySelector('input.card-input');
                            if (nextInput) {
                                nextInput.focus();
                                if (typeof nextInput.select === 'function') {
                                    nextInput.select();
                                }
                            }
                        }, 50);
                    }
                };

                const resetItem = (index) => {
                    items.value[index].promo = 'normal';
                    items.value[index].weight = null;
                    items.value[index].qty = 1;
                    items.value[index].price = null;
                };

                const clearAll = () => {
                    items.value.forEach(item => {
                        item.promo = 'normal';
                        item.weight = null;
                        item.qty = 1;
                        item.price = null;
                    });
                };

                return {
                    numItems,
                    items,
                    visibleItems,
                    results,
                    hasValidCalculations,
                    bestPricePerUnit,
                    isBestValue,
                    winningMessage,
                    formatPricePerUnit,
                    ensureMinQty,
                    focusNext,
                    onPromoChange,
                    resetItem,
                    clearAll
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
